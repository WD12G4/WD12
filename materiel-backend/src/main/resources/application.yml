spring:
  application:
    name: materiel-backend
  # -------------------------------------------------------------
  # CONFIGURATION POSTGRESQL
  # -------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/materiel_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # -------------------------------------------------------------
  # SÉCURITÉ : vérification des jetons Keycloak (voir keycloak: plus bas)
  # -------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}/realms/${keycloak.realm}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs}

  # -------------------------------------------------------------
  # CONFIGURATION JPA / HIBERNATE
  # -------------------------------------------------------------
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

# -------------------------------------------------------------
# SÉCURITÉ : JETONS KEYCLOAK (MinDef Connect)
# issuer-uri : adresse de Keycloak vue par le navigateur, comparée au champ « iss » des jetons.
# jwk-set-uri : où le backend lit les clés publiques (réseau Docker : http://keycloak:8080/auth, voir .env).
# -------------------------------------------------------------
keycloak:
  url: ${KEYCLOAK_URL:http://localhost/auth}
  realm: gestion-parc

logging:
  level:
    net.ent.etnc: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
