spring:
  application:
    name: materiel-backend
  # -------------------------------------------------------------
  # CONFIGURATION POSTGRESQL
  # -------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/materiel_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # -------------------------------------------------------------
  # CONFIGURATION JPA / HIBERNATE
  # -------------------------------------------------------------
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

# -------------------------------------------------------------
# PROPRIÉTÉS MÉTIER & SÉCURITÉ
# -------------------------------------------------------------
app:
  security:
    jwt:
      secret: ${JWT_SECRET:uneSuperCleSecreteTresLonguePourLeDevDeMonApplication2026!}
      expiration: 900000
    refresh-token:
      expiration: 2h
      cookie:
        name: materiel_refresh_token
        secure: false
        same-site: Strict
        path: /api/v1/auth
      audit:
        cleanup-cron: "0 0 3 * * ?"
        dry-run: false

logging:
  level:
    net.ent.etnc: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
