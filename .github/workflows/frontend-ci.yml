name: Frontend CI

on:
  push:
    branches: [ "main", "proto-backend-frontend", "develop", "frontBase_ESL" ]
    paths:
      - 'materiel-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "develop", "proto-backend-frontend", "frontBase_ESL" ]
    paths:
      - 'materiel-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend-build-test:
    name: Frontend Build & Type Check
    runs-on: self-hosted

    env:
      HTTP_PROXY: "http://172.16.0.1:8080"
      HTTPS_PROXY: "http://172.16.0.1:8080"
      NO_PROXY: "localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr"

    defaults:
      run:
        working-directory: ./materiel-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './materiel-frontend/package-lock.json'

      - name: Configure npm proxy
        run: |
          npm config set proxy http://172.16.0.1:8080
          npm config set https-proxy http://172.16.0.1:8080

      - name: Install dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build
