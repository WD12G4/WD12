name: Backend CI/CD

on:
  push:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/**", "projet-terrain" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend.yml'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.projet-terrain.yml'
  pull_request:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/**", "projet-terrain" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de version pour l'image Docker backend (ex: latest, v1.0.0)"
        required: false
        default: 'latest'
      skip_tests:
        description: "Passer les tests (build/push direct si coché)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. CI : Compilation & Tests unitaires / intégration & Analyse SonarQube
  # --------------------------------------------------------------------------
  backend-build-test:
    name: Backend Build & Test
    runs-on: self-hosted
    if: ${{ !inputs.skip_tests }}

    env:
      GRADLE_OPTS: "-Dhttp.proxyHost=172.16.0.1 -Dhttp.proxyPort=8080 -Dhttps.proxyHost=172.16.0.1 -Dhttps.proxyPort=8080 -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.internet.comsic|*.etrs.net|*.etrs.terre.defense.gouv.fr|192.168.*|172.16.*|10.10.*|*.pdi|*.etnc.terre.defense.gouv.fr"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materiel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./materiel-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Run Tests & Coverage
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/materiel_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar --no-daemon

  # --------------------------------------------------------------------------
  # 2. CD : Construction et publication de l'image Docker sur GHCR
  # Ne s'exécute JAMAIS sur les Pull Requests.
  # En push / dispatch, s'exécute uniquement si les tests ont réussi (ou si skip_tests est coché).
  # --------------------------------------------------------------------------
  backend-docker-publish:
    name: Build & Push Docker Image to GHCR
    runs-on: self-hosted
    needs: [backend-build-test]
    if: always() && github.event_name != 'pull_request' && (inputs.skip_tests || needs.backend-build-test.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
          TAG="${{ inputs.image_tag || 'latest' }}"
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_TAG="${GITHUB_REF_NAME:-backend}"

          echo "=========================================================="
          echo "Construction de l'image Docker : ${IMAGE_NAME}:${TAG}"
          echo "=========================================================="

          docker build \
            --network=host \
            --build-arg HTTP_PROXY="http://172.16.0.1:8080" \
            --build-arg HTTPS_PROXY="http://172.16.0.1:8080" \
            --build-arg NO_PROXY="localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr" \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:${BRANCH_TAG}" \
            -t "${IMAGE_NAME}:${SHA_TAG}" \
            -f ./materiel-backend/materiel-backend.dockerfile \
            ./materiel-backend

          echo "=========================================================="
          echo "Publication de l'image sur GHCR"
          echo "=========================================================="
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:${BRANCH_TAG}"
          docker push "${IMAGE_NAME}:${SHA_TAG}"

      - name: Test Docker Pull from GHCR
        shell: bash
        run: |
          echo "=========================================================="
          echo "Test de récupération (pull) de l'image Docker depuis GHCR"
          echo "=========================================================="
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
          TAG="${{ inputs.image_tag || 'latest' }}"
          echo "Pulling image: ${IMAGE_NAME}:${TAG}..."
          docker pull "${IMAGE_NAME}:${TAG}"
          echo "Image récupérée avec succès :"
          docker images | grep "${IMAGE_NAME}" || true
