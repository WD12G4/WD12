name: Backend CI/CD

on:
  push:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/supervision-agent" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend.yml'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.supervision.yml'

  pull_request:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/supervision-agent" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de version pour l'image Docker backend (ex: latest, v1.0.0)"
        required: false
        default: 'latest'
      skip_tests:
        description: "Passer les tests (build/push direct si coché)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. CI : Compilation & Tests unitaires / intégration & Analyse SonarQube
  # --------------------------------------------------------------------------
  backend-build-test:
    name: Backend Build & Test
    runs-on: self-hosted
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materiel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./materiel-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect & Configure Proxy
        run: |
          if timeout 2 bash -c '</dev/tcp/172.16.0.1/8080' 2>/dev/null; then
            echo "Proxy 172.16.0.1:8080 détecté -> Activation du proxy"
            echo "GRADLE_OPTS=-Dhttp.proxyHost=172.16.0.1 -Dhttp.proxyPort=8080 -Dhttps.proxyHost=172.16.0.1 -Dhttps.proxyPort=8080 -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.internet.comsic|*.etrs.net|*.etrs.terre.defense.gouv.fr|192.168.*|172.16.*|10.10.*|*.pdi|*.etnc.terre.defense.gouv.fr" >> "$GITHUB_ENV"
            echo "HTTP_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "HTTPS_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "NO_PROXY=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr" >> "$GITHUB_ENV"
          else
            echo "Proxy 172.16.0.1:8080 non joignable -> Connexion directe"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Run Tests & Coverage
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/materiel_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: SonarQube Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL non défini, étape ignorée."
            exit 0
          fi
          if ! curl -s --connect-timeout 3 -m 5 -I "$SONAR_HOST_URL" > /dev/null 2>&1; then
            echo "Serveur SonarQube ($SONAR_HOST_URL) non joignable, étape ignorée."
            exit 0
          fi
          echo "Serveur SonarQube joignable, lancement de l'analyse..."
          ./gradlew sonar --no-daemon

  # --------------------------------------------------------------------------
  # 2. CD : Construction et publication de l'image Docker sur GHCR
  # Ne s'exécute JAMAIS sur les Pull Requests.
  # En push / dispatch, s'exécute uniquement si les tests ont réussi (ou si skip_tests est coché).
  # --------------------------------------------------------------------------
  backend-docker-publish:
    name: Build & Push Docker Image to GHCR
    runs-on: self-hosted
    needs: [backend-build-test]
    if: always() && github.event_name != 'pull_request' && (inputs.skip_tests || needs.backend-build-test.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${GITHUB_REF_NAME:-backend}"
          BRANCH_CLEAN=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          # Si on est sur la branche feature/supervision-agent, publier sous un package distinct
          if [ "$REF_NAME" = "feature/supervision-agent" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-backend"
            echo "Publication sous le package distinct : ${IMAGE_NAME}"
          else
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
          fi

          TAGS_ARGS=()
          PUSH_TAGS=()

          if [ -n "${{ inputs.image_tag }}" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${{ inputs.image_tag }}")
            PUSH_TAGS+=("${IMAGE_NAME}:${{ inputs.image_tag }}")
          fi

          if [ "$REF_NAME" = "feature/supervision-agent" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:latest")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${BRANCH_CLEAN}")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:latest")
            PUSH_TAGS+=("${IMAGE_NAME}:${BRANCH_CLEAN}")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          elif [ "$REF_NAME" = "main" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:latest")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:latest")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          else
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${BRANCH_CLEAN}")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:${BRANCH_CLEAN}")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          fi

          echo "=========================================================="
          echo "Construction de l'image Docker avec les tags :"
          for t in "${PUSH_TAGS[@]}"; do
            echo "  - $t"
          done
          echo "=========================================================="

          PROXY_BUILD_ARGS=""
          if timeout 2 bash -c '</dev/tcp/172.16.0.1/8080' 2>/dev/null; then
            echo "Proxy 172.16.0.1:8080 détecté pour le build Docker"
            PROXY_BUILD_ARGS="--build-arg HTTP_PROXY=http://172.16.0.1:8080 --build-arg HTTPS_PROXY=http://172.16.0.1:8080 --build-arg NO_PROXY=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr"
          else
            echo "Pas de proxy pour le build Docker (connexion directe)"
          fi

          docker build \
            --network=host \
            ${PROXY_BUILD_ARGS} \
            "${TAGS_ARGS[@]}" \
            -f ./materiel-backend/materiel-backend.dockerfile \
            ./materiel-backend

          echo "=========================================================="
          echo "Publication des images sur GHCR"
          echo "=========================================================="
          for t in "${PUSH_TAGS[@]}"; do
            echo "Push de : $t"
            docker push "$t"
          done

      - name: Test Docker Pull from GHCR
        shell: bash
        run: |
          echo "=========================================================="
          echo "Test de récupération (pull) de l'image Docker depuis GHCR"
          echo "=========================================================="
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF_NAME="${GITHUB_REF_NAME:-backend}"
          BRANCH_CLEAN=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          INPUT_TAG="${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TEST_TAG="$INPUT_TAG"
          elif [ "$REF_NAME" = "feature/supervision-agent" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-backend"
            TEST_TAG="latest"
          elif [ "$REF_NAME" = "main" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
            TEST_TAG="latest"
          else
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
            TEST_TAG="$BRANCH_CLEAN"
          fi

          if [ -z "$IMAGE_NAME" ]; then
            if [ "$REF_NAME" = "feature/supervision-agent" ]; then
              IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-backend"
            else
              IMAGE_NAME="ghcr.io/${REPO_LOWER}-backend"
            fi
          fi

          echo "Pulling image: ${IMAGE_NAME}:${TEST_TAG}..."
          docker pull "${IMAGE_NAME}:${TEST_TAG}"
          echo "Image récupérée avec succès :"
          docker images | grep "${IMAGE_NAME}" || true
