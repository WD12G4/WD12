name: Agent Build & Release

on:
  push:
    branches: [ "main", "proto-backend-frontend" ]
    paths:
      - 'materiel-agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    branches: [ "main", "proto-backend-frontend" ]
    paths:
      - 'materiel-agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    name: Build & Package Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os_name: windows
            binary_name: MaterielAgent.exe
            archive_ext: zip
          - rid: linux-x64
            os_name: linux-x64
            binary_name: MaterielAgent
            archive_ext: tar.gz
#          - rid: linux-arm64
#            os_name: linux-arm64
#            binary_name: MaterielAgent
#            archive_ext: tar.gz
#          - rid: osx-x64
#            os_name: macos-intel
#            binary_name: MaterielAgent
#            archive_ext: tar.gz
          - rid: osx-arm64
            os_name: macos-apple-silicon
            binary_name: MaterielAgent
            archive_ext: tar.gz

    defaults:
      run:
        working-directory: ./materiel-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained Binary (${{ matrix.rid }})
        run: |
          dotnet publish MaterielAgent.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o ./out/${{ matrix.rid }}

      - name: Package Release Asset (${{ matrix.os_name }})
        run: |
          mkdir -p ./packages
          cd ./out/${{ matrix.rid }}
          cp ../../config.json ./config.json.example

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            cp ../../*.bat ./ 2>/dev/null || true
            zip -r ../../packages/materiel-agent-${{ matrix.os_name }}.zip ./*
          else
            chmod +x ${{ matrix.binary_name }}
            cp ../../*.sh ./ 2>/dev/null || true
            chmod +x ./*.sh 2>/dev/null || true
            tar -czvf ../../packages/materiel-agent-${{ matrix.os_name }}.tar.gz ./*
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: materiel-agent-${{ matrix.os_name }}
          path: ./materiel-agent/packages/*

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-agent]
    # S'exécute systématiquement lors d'un push sur les branches cibles ou un workflow_dispatch
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Flatten release assets
        run: |
          mkdir -p ./final-release
          find ./release-assets -type f -exec mv {} ./final-release/ \;
          ls -la ./final-release

      - name: Create or Update Rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: "Agent de Supervision (Dernière version)"
          body: |
            Dernière compilation automatique de l'agent de supervision multiplateforme WD12 (.NET 8).
            
            Cette version est mise à jour à chaque push sur la branche.
            
            ### Fichiers disponibles :
            - **Windows (x64)** : `materiel-agent-windows.zip`
            - **Linux (x64)** : `materiel-agent-linux-x64.tar.gz`
            - **Linux (ARM64)** : `materiel-agent-linux-arm64.tar.gz`
            - **macOS Intel (x64)** : `materiel-agent-macos-intel.tar.gz`
            - **macOS Apple Silicon (M1/M2/M3/M4)** : `materiel-agent-macos-apple-silicon.tar.gz`
          files: ./final-release/*
          draft: false
          prerelease: false
          make_latest: true
