name: Agent Build & Release

on:
  push:
    branches: [ "main", "proto-backend-frontend" ]
    paths:
      - 'materiel-agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    branches: [ "main", "proto-backend-frontend" ]
    paths:
      - 'materiel-agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. CI : Analyse de qualité de code SonarQube (.NET 10)
  # --------------------------------------------------------------------------
  agent-sonar:
    name: Agent SonarQube Analysis
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./materiel-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect & Configure Proxy
        run: |
          if timeout 2 bash -c '</dev/tcp/172.16.0.1/8080' 2>/dev/null; then
            echo "Proxy 172.16.0.1:8080 détecté -> Activation du proxy"
            echo "HTTP_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "HTTPS_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "NO_PROXY=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr" >> "$GITHUB_ENV"
            echo "http_proxy=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "https_proxy=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "no_proxy=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr" >> "$GITHUB_ENV"
          else
            echo "Proxy 172.16.0.1:8080 non joignable -> Connexion directe"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: SonarQube Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL non défini, étape ignorée."
            exit 0
          fi
          if ! curl -s --connect-timeout 3 -m 5 -I "$SONAR_HOST_URL" > /dev/null 2>&1; then
            echo "Serveur SonarQube ($SONAR_HOST_URL) non joignable, étape ignorée."
            exit 0
          fi
          echo "Serveur SonarQube joignable, préparation de l'analyse..."
          dotnet tool install --global dotnet-sonarscanner || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          echo "Lancement de SonarScanner..."
          dotnet sonarscanner begin \
            /k:"materiel-agent" \
            /n:"materiel-agent" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/out/**,**/packages/**,**/tests/**" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/tests/**,**/bin/**,**/obj/**"

          dotnet build MaterielAgent.csproj -c Release --no-incremental
          dotnet test tests/MaterielAgent.Tests.csproj -c Release --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./TestResults

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # --------------------------------------------------------------------------
  # 2. Build & Packaging Matrix
  # --------------------------------------------------------------------------
  build-agent:
    name: Build & Package Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os_name: windows
            binary_name: MaterielAgent.exe
            archive_ext: zip
          - rid: linux-x64
            os_name: linux-x64
            binary_name: MaterielAgent
            archive_ext: tar.gz
#          - rid: linux-arm64
#            os_name: linux-arm64
#            binary_name: MaterielAgent
#            archive_ext: tar.gz
#          - rid: osx-x64
#            os_name: macos-intel
#            binary_name: MaterielAgent
#            archive_ext: tar.gz
          - rid: osx-arm64
            os_name: macos-apple-silicon
            binary_name: MaterielAgent
            archive_ext: tar.gz

    defaults:
      run:
        working-directory: ./materiel-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Binary (${{ matrix.rid }})
        run: |
          dotnet publish MaterielAgent.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o ./out/${{ matrix.rid }}

      - name: Package Release Asset (${{ matrix.os_name }})
        run: |
          mkdir -p ./packages
          cd ./out/${{ matrix.rid }}
          cp ../../config.json ./config.json.example

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            cp ../../*.bat ./ 2>/dev/null || true
            zip -r ../../packages/materiel-agent-${{ matrix.os_name }}.zip ./*
          else
            chmod +x ${{ matrix.binary_name }}
            cp ../../*.sh ./ 2>/dev/null || true
            chmod +x ./*.sh 2>/dev/null || true
            tar -czvf ../../packages/materiel-agent-${{ matrix.os_name }}.tar.gz ./*
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: materiel-agent-${{ matrix.os_name }}
          path: ./materiel-agent/packages/*

  # --------------------------------------------------------------------------
  # 3. Release : Publication des binaires GitHub Releases
  # --------------------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-agent]
    # S'exécute systématiquement lors d'un push sur les branches cibles ou un workflow_dispatch
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release-assets

      - name: Flatten release assets
        run: |
          mkdir -p ./final-release
          find ./release-assets -type f -exec mv {} ./final-release/ \;
          ls -la ./final-release

      - name: Create or Update Rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: agent-latest
          name: "Agent de Supervision (Dernière version)"
          body: |
            Dernière compilation automatique de l'agent de supervision multiplateforme WD12 (.NET 10).
            
            Cette version est mise à jour à chaque push sur la branche.
            
            ### Fichiers disponibles :
            - **Windows (x64)** : `materiel-agent-windows.zip`
            - **Linux (x64)** : `materiel-agent-linux-x64.tar.gz`
            - **Linux (ARM64)** : `materiel-agent-linux-arm64.tar.gz`
            - **macOS Intel (x64)** : `materiel-agent-macos-intel.tar.gz`
            - **macOS Apple Silicon (M1/M2/M3/M4)** : `materiel-agent-macos-apple-silicon.tar.gz`
          files: ./final-release/*
          draft: false
          prerelease: false
          make_latest: true
