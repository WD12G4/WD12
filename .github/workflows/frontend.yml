name: Frontend CI/CD

on:
  push:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/supervision-agent" ]
    paths:
      - 'materiel-frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.supervision.yml'
  pull_request:
    branches: [ "main", "proto-backend-frontend", "frontBase_ESL", "feature/supervision-agent" ]
    paths:
      - 'materiel-frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de version pour l'image Docker frontend (ex: latest, v1.0.0)"
        required: false
        default: 'latest'
      skip_tests:
        description: "Passer les tests / build (push direct si coché)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. CI : Vérification TypeScript, Build & Analyse SonarQube
  # --------------------------------------------------------------------------
  frontend-build-test:
    name: Frontend Build & Type Check
    runs-on: self-hosted
    if: ${{ !inputs.skip_tests }}

    defaults:
      run:
        working-directory: ./materiel-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect & Configure Proxy
        run: |
          if timeout 2 bash -c '</dev/tcp/172.16.0.1/8080' 2>/dev/null; then
            echo "Proxy 172.16.0.1:8080 détecté -> Activation du proxy"
            echo "HTTP_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "HTTPS_PROXY=http://172.16.0.1:8080" >> "$GITHUB_ENV"
            echo "NO_PROXY=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr" >> "$GITHUB_ENV"
            echo "USE_PROXY=true" >> "$GITHUB_ENV"
          else
            echo "Proxy 172.16.0.1:8080 non joignable -> Connexion directe"
            echo "USE_PROXY=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './materiel-frontend/package-lock.json'

      - name: Configure NPM Proxy
        run: |
          if [ "$USE_PROXY" = "true" ]; then
            npm config set proxy http://172.16.0.1:8080
            npm config set https-proxy http://172.16.0.1:8080
          else
            npm config delete proxy 2>/dev/null || true
            npm config delete https-proxy 2>/dev/null || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: SonarQube Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL non défini, étape ignorée."
            exit 0
          fi
          if ! curl -s --connect-timeout 3 -m 5 -I "$SONAR_HOST_URL" > /dev/null 2>&1; then
            echo "Serveur SonarQube ($SONAR_HOST_URL) non joignable, étape ignorée."
            exit 0
          fi
          echo "Serveur SonarQube joignable, lancement de l'analyse..."
          npx --yes @sonar/scan

  # --------------------------------------------------------------------------
  # 2. CD : Construction et publication de l'image Docker sur GHCR
  # Ne s'exécute JAMAIS sur les Pull Requests.
  # En push / dispatch, s'exécute uniquement si le build a réussi (ou si skip_tests est coché).
  # --------------------------------------------------------------------------
  frontend-docker-publish:
    name: Build & Push Frontend Docker Image to GHCR
    runs-on: self-hosted
    needs: [frontend-build-test]
    if: always() && github.event_name != 'pull_request' && (inputs.skip_tests || needs.frontend-build-test.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${GITHUB_REF_NAME:-frontend}"
          BRANCH_CLEAN=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          # Si on est sur la branche feature/supervision-agent, publier sous un package distinct
          if [ "$REF_NAME" = "feature/supervision-agent" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-frontend"
            echo "Publication sous le package distinct : ${IMAGE_NAME}"
          else
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-frontend"
          fi

          TAGS_ARGS=()
          PUSH_TAGS=()

          if [ -n "${{ inputs.image_tag }}" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${{ inputs.image_tag }}")
            PUSH_TAGS+=("${IMAGE_NAME}:${{ inputs.image_tag }}")
          fi

          if [ "$REF_NAME" = "feature/supervision-agent" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:latest")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${BRANCH_CLEAN}")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:latest")
            PUSH_TAGS+=("${IMAGE_NAME}:${BRANCH_CLEAN}")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          elif [ "$REF_NAME" = "main" ]; then
            TAGS_ARGS+=(-t "${IMAGE_NAME}:latest")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:latest")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          else
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${BRANCH_CLEAN}")
            TAGS_ARGS+=(-t "${IMAGE_NAME}:${SHA_TAG}")
            PUSH_TAGS+=("${IMAGE_NAME}:${BRANCH_CLEAN}")
            PUSH_TAGS+=("${IMAGE_NAME}:${SHA_TAG}")
          fi

          echo "=========================================================="
          echo "Construction de l'image Docker avec les tags :"
          for t in "${PUSH_TAGS[@]}"; do
            echo "  - $t"
          done
          echo "=========================================================="

          PROXY_BUILD_ARGS=""
          if timeout 2 bash -c '</dev/tcp/172.16.0.1/8080' 2>/dev/null; then
            echo "Proxy 172.16.0.1:8080 détecté pour le build Docker"
            PROXY_BUILD_ARGS="--build-arg HTTP_PROXY=http://172.16.0.1:8080 --build-arg HTTPS_PROXY=http://172.16.0.1:8080 --build-arg NO_PROXY=localhost,127.0.0.1,*.internet.comsic,*.etrs.net,*.etrs.terre.defense.gouv.fr,192.168.*,172.16.*,10.10.*,*.pdi,*.etnc.terre.defense.gouv.fr"
          else
            echo "Pas de proxy pour le build Docker (connexion directe)"
          fi

          docker build \
            --network=host \
            ${PROXY_BUILD_ARGS} \
            "${TAGS_ARGS[@]}" \
            -f ./materiel-frontend/materiel-frontend.dockerfile \
            ./materiel-frontend

          echo "=========================================================="
          echo "Publication des images sur GHCR"
          echo "=========================================================="
          for t in "${PUSH_TAGS[@]}"; do
            echo "Push de : $t"
            docker push "$t"
          done

      - name: Test Docker Pull from GHCR
        shell: bash
        run: |
          echo "=========================================================="
          echo "Test de récupération (pull) de l'image Docker depuis GHCR"
          echo "=========================================================="
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF_NAME="${GITHUB_REF_NAME:-frontend}"
          BRANCH_CLEAN=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          INPUT_TAG="${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TEST_TAG="$INPUT_TAG"
          elif [ "$REF_NAME" = "feature/supervision-agent" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-frontend"
            TEST_TAG="latest"
          elif [ "$REF_NAME" = "main" ]; then
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-frontend"
            TEST_TAG="latest"
          else
            IMAGE_NAME="ghcr.io/${REPO_LOWER}-frontend"
            TEST_TAG="$BRANCH_CLEAN"
          fi

          if [ -z "$IMAGE_NAME" ]; then
            if [ "$REF_NAME" = "feature/supervision-agent" ]; then
              IMAGE_NAME="ghcr.io/${REPO_LOWER}-supervision-frontend"
            else
              IMAGE_NAME="ghcr.io/${REPO_LOWER}-frontend"
            fi
          fi

          echo "Pulling image: ${IMAGE_NAME}:${TEST_TAG}..."
          docker pull "${IMAGE_NAME}:${TEST_TAG}"
          echo "Image récupérée avec succès :"
          docker images | grep "${IMAGE_NAME}" || true
