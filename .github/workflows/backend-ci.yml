name: Backend CI

on:
  push:
    branches: [ "main",  "proto-backend-frontend" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "proto-backend-frontend" ]
    paths:
      - 'materiel-backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materiel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./materiel-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/materiel_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew test --no-daemon