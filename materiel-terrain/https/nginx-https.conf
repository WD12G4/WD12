# ------------------------------------------------------------------------------
# HTTPS de la PWA terrain : Safari (iPhone) n'autorise la caméra et le service worker qu'en HTTPS.
# Monté par docker-compose.projet-terrain.yml, activé par 40-recon-https.sh seulement si les
# certificats sont présents dans /etc/nginx/certs (sinon le site reste en HTTP, comme dans l'image).
# Les blocs location reprennent ../nginx.conf (servi en HTTP par l'image) : les garder alignés.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    # Frontend SPA routing: try file, then directory, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend API (keeps cookies & same-origin semantics)
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA Service Worker & Manifest (do not cache to allow instant updates)
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
        types {
            application/manifest+json webmanifest json;
            application/javascript js;
        }
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
    }

    # Cache static assets (including wasm for barcode scanning)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# Depuis le téléphone, http://<nom-du-mac>.local renvoie vers HTTPS.
# localhost et les adresses IP restent servis en HTTP par la configuration de l'image.
server {
    listen 80;
    server_name *.local;
    return 301 https://$host$request_uri;
}
