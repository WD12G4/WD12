services:
  # -------------------------------------------------------------
  # 1. Base de données PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: materiel_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 2. Interface web Adminer pour la base de données
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: materiel_adminer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 3. Backend Spring Boot (Java 21) - Image pré-buildée CD
  # -------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wd12g4/wd12-backend:latest}
    container_name: materiel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 4. Frontend Vue 3 (Vite + Nginx) - Image pré-buildée CD
  # -------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wd12g4/wd12-frontend:latest}
    container_name: materiel_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - keycloak
    # Adresse de l'application : le certificat HTTPS auto-signé est créé pour cette adresse.
    environment:
      APP_URL: ${APP_URL:-https://localhost}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - frontend_certs:/etc/nginx/certs
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 5. Keycloak : fournisseur d'identité (joue MinDef Connect)
  # Le realm gestion-parc (client + comptes de démonstration) est
  # rechargé depuis docker/keycloak/ à chaque démarrage.
  # -------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4}
    container_name: materiel_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Keycloak est servi sous /auth, derrière le Nginx du front (même adresse que l'application, en HTTPS).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # Adresse vue par le navigateur : c'est aussi l'émetteur (iss) des jetons, vérifié par le backend.
      KC_HOSTNAME: ${KEYCLOAK_URL:-https://localhost/auth}
      # Le backend peut joindre Keycloak par le réseau Docker (http://keycloak:8080/auth).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Adresse de l'application, lue par le realm (redirectUris : ${APP_URL}/*).
      APP_URL: ${APP_URL:-https://localhost}
    ports:
      # Accès direct, pour le serveur de développement Vite (proxy /auth) et le dépannage.
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    networks:
      - materiel_network

volumes:
  postgres_data:
    driver: local
  # Certificat HTTPS de Nginx, gardé entre les reconstructions de l'image du front.
  frontend_certs:
    driver: local

networks:
  materiel_network:
    driver: bridge
