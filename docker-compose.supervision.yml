name: wd12-supervision

services:
  # -------------------------------------------------------------
  # 1. Base de données PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: materiel_supervision_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - supervision_postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supervision_network

  # -------------------------------------------------------------
  # 2. Interface web Adminer pour la base de données
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: materiel_supervision_adminer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - supervision_network

  # -------------------------------------------------------------
  # 3. Backend Spring Boot (Java 21) - Package supervision dédié
  # -------------------------------------------------------------
  backend:
    build:
      context: ./materiel-backend
      dockerfile: materiel-backend.dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/wd12g4/wd12-supervision-backend:latest}
    container_name: materiel_supervision_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - supervision_network

  # -------------------------------------------------------------
  # 4. Frontend Vue 3 (Vite + Nginx) - Package supervision dédié
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./materiel-frontend
      dockerfile: materiel-frontend.dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/wd12g4/wd12-supervision-frontend:latest}
    container_name: materiel_supervision_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - supervision_network

volumes:
  supervision_postgres_data:
    driver: local

networks:
  supervision_network:
    driver: bridge
