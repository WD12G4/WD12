services:
  # -------------------------------------------------------------
  # 1. Base de données PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: projet_terrain_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-materiel_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 2. Interface web Adminer pour la base de données
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: projet_terrain_adminer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 3. Backend Spring Boot (Java 21) - Projet Terrain
  # -------------------------------------------------------------
  backend:
    build:
      context: ./materiel-backend
      dockerfile: projet-terrain-backend.dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/wd12g4/projet-terrain-backend:latest}
    container_name: projet_terrain_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - materiel_network

  # -------------------------------------------------------------
  # 4. Frontend Vue 3 PWA (Vite + Nginx) - materiel-terrain
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./materiel-terrain
      dockerfile: projet-terrain-frontend.dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/wd12g4/projet-terrain-frontend:latest}
    container_name: projet_terrain_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - materiel_network

volumes:
  postgres_data:
    driver: local

networks:
  materiel_network:
    driver: bridge
